<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Playfair Display'; src: url('../fonts/playfair-display-latin.woff2') format('woff2'); font-weight: 400 800; }
html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
/* Apple's icon grid: an 824px rounded square centred on a 1024px canvas. */
.tile {
  position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: radial-gradient(120% 90% at 50% 0%, #1b1b1f 0%, #060607 60%, #000 100%);
  box-shadow: inset 0 0 0 2px rgba(201, 169, 106, 0.35), 0 20px 40px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
}
.j {
  font-family: "Playfair Display"; font-weight: 600; font-size: 600px; line-height: 1; padding: 40px 30px 200px; margin-top: 60px;
  background: linear-gradient(180deg, #9c7a41 0%, #f0dea8 48%, #c9a96a 72%, #9c7a41 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
</style></head>
<body><div class="tile"><span class="j">J</span></div></body></html>
