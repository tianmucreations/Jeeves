name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      # A version already on npm is never published twice (a re-sent release marker
      # would otherwise fail the run).
      - name: Publish unless this version is already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@tianmucreations/jeeves@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm - nothing to publish."
          else
            npm publish
          fi